<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 90 900 420" width="900" height="420" role="img" aria-labelledby="t">
<title id="t">EDUFLOW learning path generator</title>
<style>
.up{transform-box:fill-box;transform-origin:50% 100%;animation:up 7s cubic-bezier(.2,.8,.2,1) infinite both}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow 7s cubic-bezier(.2,.8,.2,1) infinite both}
.in{animation:in 7s ease infinite both}
.pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop 7s cubic-bezier(.3,1.4,.5,1) infinite both}
.ring{transform-box:fill-box;transform-origin:50% 50%;animation:ring 2.4s ease-out infinite}
.bob{animation:bob 3.2s ease-in-out infinite alternate}
.flow{stroke-dasharray:8 9;animation:flow 1s linear infinite}
.caret{animation:blink 1.1s steps(1) infinite}
.breathe{transform-box:fill-box;transform-origin:50% 50%;animation:breathe 6s ease-in-out infinite alternate}
.sheen{animation:sheen 7s ease-in-out infinite}
@keyframes up{0%{transform:scaleY(0)}20%,90%{transform:scaleY(1)}100%{transform:scaleY(0)}}
@keyframes grow{0%{transform:scaleX(0)}20%,90%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes in{0%{opacity:0;transform:translateY(10px)}12%,90%{opacity:1;transform:none}100%{opacity:0}}
@keyframes pop{0%{opacity:0;transform:scale(0)}10%,90%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.6)}}
@keyframes ring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
@keyframes bob{from{transform:translateY(-7px)}to{transform:translateY(7px)}}
@keyframes flow{to{stroke-dashoffset:-34}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes breathe{from{transform:scale(.9);opacity:.75}to{transform:scale(1.08);opacity:1}}
@keyframes sheen{0%{transform:translateX(0)}30%,100%{transform:translateX(1500px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.dr369{stroke-dasharray:369;animation:dr369 7s ease-in-out infinite both}@keyframes dr369{0%{stroke-dashoffset:369}30%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:-369}}</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#010810"/><stop offset=".6" stop-color="#061522"/><stop offset="1" stop-color="#0a1e30"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#00c896" stop-opacity=".3"/><stop offset="1" stop-color="#00c896" stop-opacity="0"/></radialGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#96afc8" opacity=".14"/></pattern>

<clipPath id="round"><rect x="0" y="90" width="900" height="420" rx="22"/></clipPath>
</defs>
<g clip-path="url(#round)">
<rect width="900" height="600" fill="url(#bg)"/>
<rect width="900" height="600" fill="url(#dots)"/>
<circle class="breathe" cx="670" cy="300" r="290" fill="url(#glow)"/>
<g transform="translate(-40 0)">
<g stroke="#2c4a6e" stroke-width="3"><line class="in" x1="560" y1="170" x2="650" y2="250" style="animation-delay:0.10s"/><line class="in" x1="560" y1="170" x2="520" y2="290" style="animation-delay:0.15s"/><line class="in" x1="650" y1="250" x2="760" y2="210" style="animation-delay:0.20s"/><line class="in" x1="650" y1="250" x2="700" y2="360" style="animation-delay:0.25s"/><line class="in" x1="520" y1="290" x2="600" y2="400" style="animation-delay:0.30s"/><line class="in" x1="700" y1="360" x2="800" y2="330" style="animation-delay:0.35s"/><line class="in" x1="700" y1="360" x2="640" y2="470" style="animation-delay:0.40s"/><line class="in" x1="600" y1="400" x2="640" y2="470" style="animation-delay:0.45s"/></g>
<path class="dr369" d="M560 170 L650 250 L700 360 L640 470" fill="none" stroke="#2fffc0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.60s"/>
<g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle"><g class="pop" style="animation-delay:0.30s"><circle cx="560" cy="170" r="30" fill="#0a1e30" stroke="#2fffc0" stroke-width="3"/><text x="560" y="175" fill="#e2eeff">Intro</text></g><g class="pop" style="animation-delay:0.50s"><circle cx="520" cy="290" r="26" fill="#0a1e30" stroke="#2c4a6e" stroke-width="3"/><text x="520" y="295" fill="#96afc8">Web</text></g><g class="pop" style="animation-delay:0.60s"><circle cx="760" cy="210" r="26" fill="#0a1e30" stroke="#2c4a6e" stroke-width="3"/><text x="760" y="215" fill="#96afc8">DB</text></g><g class="pop" style="animation-delay:1.00s"><circle cx="650" cy="250" r="30" fill="#0a1e30" stroke="#2fffc0" stroke-width="3"/><text x="650" y="255" fill="#e2eeff">DS</text></g><g class="pop" style="animation-delay:0.70s"><circle cx="800" cy="330" r="26" fill="#0a1e30" stroke="#2c4a6e" stroke-width="3"/><text x="800" y="335" fill="#96afc8">Algo</text></g><g class="pop" style="animation-delay:0.80s"><circle cx="600" cy="400" r="26" fill="#0a1e30" stroke="#2c4a6e" stroke-width="3"/><text x="600" y="405" fill="#96afc8">API</text></g><g class="pop" style="animation-delay:1.60s"><circle cx="700" cy="360" r="30" fill="#0a1e30" stroke="#2fffc0" stroke-width="3"/><text x="700" y="365" fill="#e2eeff">ML</text></g>
<circle class="ring" cx="640" cy="470" r="32" fill="none" stroke="#00c896" stroke-width="2"/>
<g class="pop" style="animation-delay:2.20s"><circle cx="640" cy="470" r="32" fill="#00c896"/><text x="640" y="475" fill="#00140e">DL</text></g>
</g></g>
<g transform="translate(0 46)">
<text x="70" y="150" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#2fffc0" letter-spacing="4">C++ · DATA STRUCTURES</text>
<rect class="caret" x="372" y="135" width="10" height="18" fill="#2fffc0"/>
<text x="68" y="232" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="#e2eeff" letter-spacing="-1.5">EDUFLOW</text>
<text x="70" y="276" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#96afc8">Score courses · follow prerequisites</text>
<text x="70" y="304" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#96afc8">· plan the week</text>
<g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700"><rect x="70" y="346" width="99" height="34" rx="17" fill="#0a1e30" stroke="#00c896" stroke-opacity=".6"/><text x="119.5" y="368" text-anchor="middle" fill="#e2eeff">AVL tree</text><rect x="181" y="346" width="73" height="34" rx="17" fill="#0a1e30" stroke="#00c896" stroke-opacity=".6"/><text x="217.5" y="368" text-anchor="middle" fill="#e2eeff">Graph</text><rect x="266" y="346" width="56" height="34" rx="17" fill="#0a1e30" stroke="#00c896" stroke-opacity=".6"/><text x="294" y="368" text-anchor="middle" fill="#e2eeff">BST</text></g>
</g>
<g transform="skewX(-18)"><rect class="sheen" x="-420" y="0" width="220" height="600" fill="url(#sh)"/></g>
<g transform="translate(70 468)">
<rect width="241" height="30" rx="15" fill="#00c896" fill-opacity=".14" stroke="#00c896" stroke-opacity=".7"/>
<circle class="ring" cx="18" cy="15" r="5" fill="none" stroke="#2fffc0" stroke-width="2"/>
<circle cx="18" cy="15" r="4.5" fill="#2fffc0"/>
<text x="34" y="20" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e2eeff">See it on my portfolio ↗</text>
</g>
</g>
</svg>
